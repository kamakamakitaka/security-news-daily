name: Daily Security News Analyzer

on:
  schedule:
    # 毎日 12:35 UTC (日本時間 21:35)
    - cron: '35 12 * * *'

  # 手動実行用
  workflow_dispatch:

permissions:
  contents: write
  repository-projects: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials files
        run: |
          mkdir -p credentials
          echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > credentials/credentials.json
          echo '${{ secrets.GMAIL_TOKEN_PICKLE }}' | base64 -d > credentials/token.pickle

      - name: Run analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python src/main.py

      - name: Commit and push results
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto: Daily security news analysis $(date '+%Y-%m-%d')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-logs
          path: logs/
          retention-days: 7
